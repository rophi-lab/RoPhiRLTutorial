[project]
name = "rophi-rl-tutorial"
version = "0.1.0"
description = "GPU RL training for reflexive grasping: Flexiv Rizon 4 + Robotis 5F hand on mjlab."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab>=1.5,<2",
    "trimesh>=4.8.3",
]

[project.optional-dependencies]
cu128 = ["mjlab[cu128]"]
cpu = ["mjlab[cpu]"]
# Convex decomposition for one-time object prep. Not needed at train/play time -- the
# prepared collision meshes are read from disk.
assets = ["coacd>=1.0"]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "ipdb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rophi_rl_tutorial"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
